name: Release (Android + iOS)

# Major versions only: pushing a tag like v2.0.0 builds both apps on EAS
# and submits them automatically (Google Play internal track + TestFlight).
# Minor/patch tags (v2.1.0, v2.1.1) do NOT trigger this; use "Run workflow" for those.
on:
  push:
    tags:
      - 'v[0-9]+.0.0'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, android, ios]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches app.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APPV=$(node -p "require('./app.json').expo.version")
          echo "tag=$TAG app.json=$APPV"
          if [ "$TAG" != "$APPV" ]; then
            echo "::error::Tag v$TAG does not match expo.version $APPV in app.json"
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Android service account for Play submit
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > play-service-account.json

      - name: Build and submit
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        run: |
          eas build --platform "$PLATFORM" --profile production \
            --non-interactive --no-wait --auto-submit-with-profile=ci
